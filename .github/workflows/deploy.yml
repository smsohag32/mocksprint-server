name: Deploy Minified Node JS Backend (Namecheap)

on:
   push:
      branches:
         - deployment

env:
   # Opt-in to Node 24 as required by the deprecation warning
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   build_and_deploy:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4 # Updated to v4

         - name: Install Node.js
           uses: actions/setup-node@v4 # Updated to v4
           with:
              node-version: "22" # Updated to Node 22 (or 24)

         - name: Install dependencies
           run: npm install --force

         - name: Build & Minify with ncc
           run: |
              npm install -g @vercel/ncc
              rm -rf dist
              # Minify into app.js
              ncc build app.ts -o dist -m -e bcrypt -e mysql2 -e playwright
              mv dist/index.js dist/app.js

         - name: Copy additional files to dist
           run: |
              cp package.json dist/
              [ -f .htaccess ] && cp .htaccess dist/ || echo "No .htaccess found"
              [ -f .env.example ] && cp .env.example dist/.env.example || echo "No .env.example found"

         - name: 🔍 Verify build output
           run: ls -la dist/

         - name: 📂 Sync files to Namecheap via FTP
           uses: SamKirkland/FTP-Deploy-Action@v4.3.4
           with:
              server: ${{ secrets.FTP_SERVER }}
              username: ${{ secrets.FTP_USERNAME }}
              password: ${{ secrets.FTP_PASSWORD }}
              protocol: ftps
              local-dir: ./dist/
              delete-removed: false
